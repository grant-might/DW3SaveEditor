[pytest]
# Bare `pytest` runs only non-GUI tests so it is safe in any environment.
# GUI tests need a display and are run via `python run_tests.py` (isolated
# process) or `pytest -m gui`. See run_tests.py for why isolation matters.
markers =
    gui: tests that construct a QApplication (must run in an isolated process)
addopts = -m "not gui"
