[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmw3editor"
version = "0.1.1"
description = "A save editor for Digimon World 3 (PS1) — edits party Digimon, levels, partner, Bits and play time on raw / DexDrive / VGS / VMP memory cards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [
    { name = "DMW3SaveEditor contributors" },
]
keywords = ["digimon", "digimon-world-3", "ps1", "save-editor", "memory-card"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6==6.11.2",
    "numpy==2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
dmw3-save-editor = "dmw3editor.ui.main_window:main"

[project.urls]
Homepage = "https://github.com/grant-might/DMW3SaveEditor"
Source = "https://github.com/grant-might/DMW3SaveEditor"

[tool.setuptools.packages.find]
include = ["dmw3editor*"]

[tool.setuptools.package-data]
dmw3editor = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
